<script setup lang="ts">
import { ref, computed } from 'vue'
import { useRouter } from 'vue-router'
import Icon from '@/components/Icon.vue'
import { useWorkbench } from '@/stores/useWorkbench'
import { useGrowth } from '@/stores/useGrowth'
import { dayjs, fmt, weekStart, SITE_START, started, siteDays, daysToStart, siteStartText, statsFrom } from '@/lib/date'
import {
  buildDays, summarize, siteStreak, habitRates, buildTrend, dimLevel,
  HEAT_DIMS, GREEN_SCALE, MOOD_SCALE, EMPTY_CELL,
  type HeatDim, type TrendUnit, type DayStat
} from '@/lib/statsEngine'

// =========================================================
// 统计页：store 之间不互相调用，打卡数据来自 useWorkbench，
// 记录数据来自 useGrowth，组合全部发生在视图层，天然无环。
// 计算层在 statsEngine.ts（纯函数），本文件只做编排与渲染。
// =========================================================

const router = useRouter()
const { habits, checkins, todayItems, doneItems } = useWorkbench()
const { records } = useGrowth()

// ---------- 时间范围 ----------
const RANGES = [
  { v: 30, t: '近30天' },
  { v: 90, t: '近90天' },
  { v: 182, t: '近半年' }
]
const rangeDays = ref(90)
const rangeLabel = computed(() => RANGES.find((r) => r.v === rangeDays.value)?.t || '')
// 左端点自动受全站起始日约束，起始日之前的历史不往统计里掺
const from = computed(() => statsFrom(rangeDays.value))
const to = computed(() => dayjs())

/** 起始日的进度说明：到了报第几天，没到就倒计时 */
const startNote = computed(() =>
  started() ? `起始日 ${siteStartText()}，今天是第 ${siteDays()} 天` : `还没到起始日（${SITE_START}），还有 ${daysToStart()} 天`
)

// ---------- 计算层 ----------
const days = computed(() => buildDays(habits.value, checkins.value, records.value, from.value, to.value))
const summary = computed(() => summarize(days.value))
const streak = computed(() => siteStreak(checkins.value))
const rates = computed(() => habitRates(habits.value, checkins.value, from.value, to.value))

const hasAny = computed(() => checkins.value.length > 0 || records.value.length > 0)
const todayRate = computed(() => (todayItems.value.length ? doneItems.value.length / todayItems.value.length : 0))

const cards = computed(() => [
  { icon: 'check', label: '累计打卡', value: String(summary.value.checkDays), unit: '天', sub: `${summary.value.checkTimes} 次打卡` },
  { icon: 'flame', label: '当前连续', value: String(streak.value.current), unit: '天', sub: '至少完成 1 个习惯' },
  { icon: 'star', label: '最长连续', value: String(streak.value.best), unit: '天', sub: '历史最好的一段' },
  { icon: 'chart', label: '完成率', value: String(Math.round(summary.value.rate * 100)), unit: '%', sub: '完成度 ÷ 排期' }
])

// ---------- 热力图 ----------
const heatDim = ref<HeatDim>('done')
const dimHint = computed(() => HEAT_DIMS.find((d) => d.v === heatDim.value)?.hint || '')

const heatMax = computed(() => {
  if (heatDim.value === 'done') return Math.max(1, ...days.value.map((d) => d.done))
  if (heatDim.value === 'records') return Math.max(1, ...days.value.map((d) => d.records))
  return 1
})

const CELL = 13
const PITCH = 16
const LEFT_PAD = 24
const TOP_PAD = 18
const WEEK_LABELS = [
  { row: 0, t: '一' },
  { row: 2, t: '三' },
  { row: 4, t: '五' }
]

function dayTitle(st: DayStat): string {
  const d = `${st.date}`
  if (heatDim.value === 'done') return `${d} · 完成 ${st.done} 个`
  if (heatDim.value === 'rate') return `${d} · 完成率 ${Math.round(st.rateWeighted * 100)}%`
  if (heatDim.value === 'records') return `${d} · ${st.records} 条记录`
  return st.mood ? `${d} · 心情 ${st.mood.toFixed(1)}` : `${d} · 没记心情`
}

const heat = computed(() => {
  const map = new Map(days.value.map((d) => [d.date, d]))
  const first = weekStart(from.value)
  const last = to.value.startOf('day')
  const weeks = Math.max(1, Math.floor(last.diff(first, 'day') / 7) + 1)
  const palette = heatDim.value === 'mood' ? MOOD_SCALE : GREEN_SCALE

  const cells: { key: string; x: number; y: number; fill: string; title: string }[] = []
  for (let i = 0; i < weeks * 7; i++) {
    const dt = first.add(i, 'day')
    if (dt.isAfter(last, 'day')) break
    const key = fmt(dt)
    const st = map.get(key)
    const lv = st ? dimLevel(st, heatDim.value, heatMax.value) : 0
    cells.push({
      key,
      x: LEFT_PAD + Math.floor(i / 7) * PITCH,
      y: TOP_PAD + (i % 7) * PITCH,
      fill: lv ? palette[lv - 1] : EMPTY_CELL,
      title: st ? dayTitle(st) : `${key} · 无数据`
    })
  }

  // 月份标签：跨月的第一列打标
  const monthLabels: { key: string; x: number; t: string }[] = []
  let prevMonth = first.month()
  for (let col = 0; col < weeks; col++) {
    const dt = first.add(col * 7, 'day')
    if (dt.isAfter(last, 'day')) break
    const m = dt.month()
    if (col === 0 || m !== prevMonth) {
      monthLabels.push({ key: `m${col}`, x: LEFT_PAD + col * PITCH, t: `${m + 1}月` })
    }
    prevMonth = m
  }

  return {
    cells,
    monthLabels,
    width: LEFT_PAD + weeks * PITCH + 6,
    height: TOP_PAD + 7 * PITCH + 6
  }
})

// ---------- 周 / 月趋势 ----------
const trendUnit = ref<TrendUnit>('week')
const trend = computed(() => buildTrend(days.value, trendUnit.value, trendUnit.value === 'week' ? 8 : 6))

const TW = 360
const TH = 172
const T_L = 12
const T_T = 16
const T_R = 12
const T_B = 30
const plotW = TW - T_L - T_R
const plotH = TH - T_T - T_B
const baseY = T_T + plotH

const trendChart = computed(() => {
  const pts = trend.value
  const n = pts.length
  if (!n) return { bars: [], dots: [], linePath: '', areaPath: '', maxDone: 1 }
  const band = plotW / n
  const bw = Math.min(16, band * 0.42)
  const maxDone = Math.max(1, ...pts.map((p) => p.done))
  const bars = pts.map((p, i) => {
    const cx = T_L + band * i + band / 2
    const h = (p.done / maxDone) * plotH
    return { key: p.key, x: cx - bw / 2, y: baseY - h, w: bw, h, label: p.label, done: p.done }
  })
  const dots = pts.map((p, i) => ({
    key: p.key,
    cx: T_L + band * i + band / 2,
    cy: baseY - p.rate * plotH,
    rate: p.rate
  }))
  const linePath = dots.map((d, i) => `${i ? 'L' : 'M'}${d.cx.toFixed(1)} ${d.cy.toFixed(1)}`).join(' ')
  const areaPath = `${linePath} L${dots[n - 1].cx.toFixed(1)} ${baseY} L${dots[0].cx.toFixed(1)} ${baseY} Z`
  return { bars, dots, linePath, areaPath, maxDone }
})

const gridPct = [0, 0.5, 1]
const gridY = (p: number) => baseY - p * plotH
</script>

<template>
  <div class="max-w-3xl mx-auto p-4 sm:p-6 space-y-5">
    <!-- 头部 -->
    <header class="flex flex-wrap items-end gap-3 pt-2">
      <div>
        <h1 class="text-[22px] font-semibold text-ink-700">统计</h1>
        <div class="text-[13px] text-ink-400 mt-0.5">
          {{ rangeLabel }} · {{ startNote }}
        </div>
      </div>
      <div class="ml-auto flex gap-2">
        <button v-for="r in RANGES" :key="r.v" class="chip" :class="rangeDays === r.v ? '!bg-moss-500 !text-white !border-moss-500' : ''"
                @click="rangeDays = r.v">
          {{ r.t }}
        </button>
      </div>
    </header>

    <!-- 今日进度（置顶，打开就看见） -->
    <section class="card card-pad">
      <div class="flex items-center gap-2">
        <Icon name="flame" :size="18" color="#5A9B6D" />
        <span class="section-title">今天进度</span>
        <span class="text-[13px] text-ink-400 ml-auto">
          已完成 {{ doneItems.length }} / {{ todayItems.length }}
        </span>
      </div>
      <div class="mt-3 h-2.5 rounded-full bg-cream-200 overflow-hidden">
        <div class="h-full rounded-full bg-moss-500 transition-all duration-500"
             :style="{ width: Math.round(todayRate * 100) + '%' }" />
      </div>
      <div class="mt-2 flex items-center gap-2 text-[13px]">
        <span class="text-moss-700 font-medium">{{ Math.round(todayRate * 100) }}%</span>
        <span class="text-ink-400">{{ todayItems.length ? '还剩 ' + (todayItems.length - doneItems.length) + ' 个' : '今天没有排期的习惯' }}</span>
        <button class="ml-auto text-moss-600 text-[13px]" @click="router.push('/?tab=today')">去打卡</button>
      </div>
    </section>

    <!-- 概要四卡 -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div v-for="c in cards" :key="c.label" class="card card-pad">
        <div class="flex items-center gap-1.5 text-ink-400 text-[13px]">
          <Icon :name="c.icon" :size="16" color="#7BB68C" />
          {{ c.label }}
        </div>
        <div class="mt-2 flex items-baseline gap-1">
          <span class="text-[26px] font-semibold text-ink-700 leading-none">{{ c.value }}</span>
          <span class="text-[13px] text-ink-400">{{ c.unit }}</span>
        </div>
        <div class="mt-1.5 text-[12px] text-ink-400 truncate">{{ c.sub }}</div>
      </div>
    </section>

    <!-- 每日热力图 -->
    <section class="card card-pad">
      <div class="flex flex-wrap items-center gap-2">
        <Icon name="grid" :size="18" color="#5A9B6D" />
        <span class="section-title">每日热力图</span>
        <div class="ml-auto flex flex-wrap gap-2">
          <button v-for="d in HEAT_DIMS" :key="d.v" class="chip"
                  :class="heatDim === d.v ? '!bg-moss-500 !text-white !border-moss-500' : ''"
                  @click="heatDim = d.v">
            {{ d.t }}
          </button>
        </div>
      </div>
      <p class="mt-1.5 text-[12px] text-ink-400">{{ dimHint }}</p>

      <div class="mt-3 overflow-x-auto -mx-1 px-1">
        <svg :width="heat.width" :height="heat.height" :viewBox="`0 0 ${heat.width} ${heat.height}`" role="img"
             aria-label="每日热力图">
          <text v-for="w in WEEK_LABELS" :key="w.row" :x="LEFT_PAD - 6" :y="TOP_PAD + w.row * PITCH + 10"
                text-anchor="end" font-size="10" fill="#A8A294">{{ w.t }}</text>
          <text v-for="m in heat.monthLabels" :key="m.key" :x="m.x" :y="11" text-anchor="start"
                font-size="10" fill="#A8A294">{{ m.t }}</text>
          <g>
            <rect v-for="c in heat.cells" :key="c.key" :x="c.x" :y="c.y" :width="CELL" :height="CELL" rx="3"
                  :fill="c.fill">
              <title>{{ c.title }}</title>
            </rect>
          </g>
        </svg>
      </div>

      <div class="mt-3 flex items-center gap-1.5 text-[11px] text-ink-400">
        <span>少</span>
        <i v-for="(s, i) in (heatDim === 'mood' ? MOOD_SCALE : GREEN_SCALE)" :key="i" class="w-3.5 h-3.5 rounded-[3px]"
           :style="{ background: s }" />
        <i class="w-3.5 h-3.5 rounded-[3px]" :style="{ background: EMPTY_CELL }" />
        <span>多</span>
        <span v-if="heatDim === 'mood'" class="ml-2">低落的偏冷，舒展的转绿</span>
      </div>
    </section>

    <!-- 各习惯完成率 -->
    <section class="card card-pad">
      <div class="flex items-center gap-2 mb-3">
        <Icon name="list" :size="18" color="#5A9B6D" />
        <span class="section-title">各习惯完成率</span>
        <span class="text-[12px] text-ink-400 ml-auto">严格=看达标天数，加权=看完成度</span>
      </div>

      <div v-if="rates.length" class="space-y-4">
        <div v-for="r in rates" :key="r.habit._id">
          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-xl flex items-center justify-center shrink-0"
                  :style="{ background: r.habit.color + '22' }">
              <Icon :name="r.habit.icon" :size="16" :color="r.habit.color" />
            </span>
            <span class="text-[15px] text-ink-700 truncate">{{ r.habit.name }}</span>
            <span class="text-[12px] text-ink-400 ml-auto shrink-0">连续 {{ r.current }} 天 · 累计 {{ r.total }}</span>
          </div>
          <div class="mt-2 grid grid-cols-[auto_1fr_auto] sm:grid-cols-[56px_1fr_auto] items-center gap-2">
            <span class="text-[12px] text-ink-400">严格</span>
            <div class="h-2 rounded-full bg-cream-200 overflow-hidden">
              <div class="h-full rounded-full transition-all duration-500"
                   :style="{ width: Math.round(r.strict * 100) + '%', background: r.habit.color }" />
            </div>
            <span class="text-[12px] text-ink-500 w-9 text-right">{{ Math.round(r.strict * 100) }}%</span>

            <span class="text-[12px] text-ink-400">加权</span>
            <div class="h-2 rounded-full bg-cream-200 overflow-hidden">
              <div class="h-full rounded-full transition-all duration-500"
                   :style="{ width: Math.round(r.weighted * 100) + '%', background: r.habit.color + 'CC' }" />
            </div>
            <span class="text-[12px] text-ink-500 w-9 text-right">{{ Math.round(r.weighted * 100) }}%</span>
          </div>
        </div>
      </div>

      <div v-else class="py-6 text-center text-[14px] text-ink-400">
        还没有习惯，先去加一个吧
      </div>
    </section>

    <!-- 周 / 月趋势 -->
    <section class="card card-pad">
      <div class="flex items-center gap-2">
        <Icon name="chart" :size="18" color="#5A9B6D" />
        <span class="section-title">趋势</span>
        <div class="ml-auto flex gap-2">
          <button class="chip" :class="trendUnit === 'week' ? '!bg-moss-500 !text-white !border-moss-500' : ''"
                  @click="trendUnit = 'week'">按周</button>
          <button class="chip" :class="trendUnit === 'month' ? '!bg-moss-500 !text-white !border-moss-500' : ''"
                  @click="trendUnit = 'month'">按月</button>
        </div>
      </div>
      <div class="mt-1.5 flex items-center gap-3 text-[11px] text-ink-400">
        <span class="flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-sm bg-moss-300" />完成数量</span>
        <span class="flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-full bg-moss-600" />完成率</span>
      </div>

      <svg class="w-full mt-2" :viewBox="`0 0 ${TW} ${TH}`" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="完成趋势">
        <line v-for="p in gridPct" :key="p" :x1="T_L" :y1="gridY(p)" :x2="T_L + plotW" :y2="gridY(p)"
              stroke="#EDE7DA" stroke-width="1" stroke-dasharray="3 3" />

        <rect v-for="b in trendChart.bars" :key="b.key" :x="b.x" :y="b.y" :width="b.w" :height="Math.max(b.h, b.done ? 2 : 0)"
              rx="3" fill="#A5CFB0">
          <title>{{ b.label }} · 完成 {{ b.done }} 次</title>
        </rect>

        <path v-if="trendChart.linePath" :d="trendChart.areaPath" fill="#5A9B6D" opacity="0.08" />
        <path v-if="trendChart.linePath" :d="trendChart.linePath" fill="none" stroke="#437C55" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" />
        <circle v-for="d in trendChart.dots" :key="d.key" :cx="d.cx" :cy="d.cy" r="3.2" fill="#fff"
                stroke="#437C55" stroke-width="1.8">
          <title>完成率 {{ Math.round(d.rate * 100) }}%</title>
        </circle>

        <text v-for="b in trendChart.bars" :key="`t${b.key}`" :x="b.x + b.w / 2" :y="TH - 10" text-anchor="middle"
              font-size="10" fill="#8B8578">{{ b.label }}</text>
      </svg>

      <p v-if="!hasAny" class="mt-2 text-center text-[13px] text-ink-400">
        图表还没数据。今天打第一个卡，明天就有第一格了。
      </p>
    </section>

    <p class="text-center text-[12px] text-ink-400 pb-2">
      这里的每一个数字，都是从你真正开始的那天算起的。
    </p>
  </div>
</template>
